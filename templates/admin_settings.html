{% extends 'admin_base.html' %}

{% block content %}
<div class="mb-8 flex items-center gap-3">
    <div class="w-10 h-10 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center text-lg shadow-sm border border-slate-200">
        <i class="fa-solid fa-sliders"></i>
    </div>
    <div>
        <h1 class="text-2xl font-black text-slate-800">Gateway Settings</h1>
        <p class="text-xs text-slate-500 mt-1">Configure global platform behavior.</p>
    </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <h3 class="text-base font-bold text-slate-800 mb-6"><i class="fa-solid fa-power-off text-primary mr-2"></i> Core Settings</h3>
        
        <form action="/admin/settings" method="POST">
            <!-- Maintenance Mode -->
            <div class="mb-8 border border-slate-200 rounded-xl p-4 bg-slate-50">
                <div class="flex items-center justify-between mb-2">
                    <div>
                        <label class="block text-sm font-bold text-slate-800">Maintenance Mode</label>
                        <p class="text-[10px] text-slate-500 mt-0.5">Turns off the entire platform for merchants and customers.</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" value="true" name="maintenance_mode" class="sr-only peer" {% if maintenance_mode == 'true' %}checked{% endif %}>
                      <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500"></div>
                    </label>
                </div>
                {% if maintenance_mode == 'true' %}
                <div class="mt-3 text-[10px] font-bold text-red-600 flex items-center gap-1"><i class="fa-solid fa-triangle-exclamation"></i> CURRENTLY ACTIVE - PLATFORM IS OFFLINE</div>
                {% endif %}
            </div>

            <!-- Change Admin Password -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-slate-700 mb-2">Change Super Admin Password</label>
                <input type="password" name="admin_password" placeholder="Leave blank to keep current" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary shadow-sm">
            </div>

            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition-colors shadow-sm text-sm">
                Save Configurations
            </button>
        </form>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has("success")) {
        Swal.fire({
            icon: "success",
            title: "Success",
            text: urlParams.get("success"),
            confirmButtonColor: "#4f46e5",
            timer: 2000,
            showConfirmButton: false
        });
        window.history.replaceState({}, document.title, window.location.pathname);
    }
</script>
{% endblock %}

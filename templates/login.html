<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - FamPay PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background: #FCFAF4; font-family: 'IBM Plex Sans', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .gp-serif { font-family: 'Fraunces', serif; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid #E7DFC9; }
        .btn-gold { background: #C9A227; color: white; font-weight: 600; width: 100%; padding: 10px; }
        .btn-gold:hover { background: #A8841F; color: white; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 class="gp-serif text-center mb-4">Login to FamPay</h2>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-gold">Login</button>
        </form>
        <p class="text-center mt-3 text-muted">Don't have an account? <a href="/register" style="color: #C9A227;">Register here</a></p>
    </div>
</body>
</html>
